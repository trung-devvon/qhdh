<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Tập Trắc Nghiệm Hệ Điều Hành</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="container header-content">
      <div class="brand" onclick="showView('home')">
        <div class="brand-icon">⚡</div>
        <div>
          <div class="brand-title">Quiz Hệ Điều Hành</div>
          <div class="brand-subtitle">Ôn tập trắc nghiệm kiến thức</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- 1. MÀN HÌNH CHÍNH (HOME) -->
    <section id="view-home">
      <div class="hero-section">
        <h1 class="hero-title">Chọn chương để ôn tập</h1>
        <p class="hero-desc">Xem trước đáp án hoặc bắt đầu làm bài trắc nghiệm ngay</p>
      </div>

      <!-- 3 Card tương ứng 3 chương -->
      <div id="chapter-cards" class="cards-grid">
        <!-- Rendered by JavaScript -->
      </div>
    </section>

    <!-- 2. TRANG XEM HẾT (REVIEW MODE) -->
    <section id="view-review" class="hidden">
      <div class="view-top-bar">
        <button class="btn btn-outline" onclick="showView('home')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Quay lại trang chủ
        </button>
        <h2 id="review-title" class="view-header-title"></h2>
        <span id="review-total-badge" class="badge"></span>
      </div>

      <!-- Danh sách tất cả câu hỏi với đáp án đúng tô xanh mờ -->
      <div id="review-questions-list" class="review-questions-list">
        <!-- Rendered by JavaScript -->
      </div>
    </section>

    <!-- 3. TRANG BẮT ĐẦU (QUIZ MODE) -->
    <section id="view-quiz" class="hidden">
      <div class="view-top-bar">
        <button class="btn btn-outline" onclick="showView('home')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Về trang chủ
        </button>
        <h2 id="quiz-title" class="view-header-title"></h2>
        <button class="btn btn-ghost" onclick="resetQuiz()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Làm lại từ đầu
        </button>
      </div>

      <!-- Thanh thống kê điểm số -->
      <div class="quiz-stats-card">
        <div class="stats-group">
          <span>Tiến độ: <strong id="stat-answered">0 / 0</strong></span>
        </div>
        <div class="stats-group">
          <span class="stat-badge success">✓ Đúng: <strong id="stat-correct">0</strong></span>
          <span class="stat-badge danger">✗ Sai: <strong id="stat-wrong">0</strong></span>
        </div>
      </div>

      <!-- Thanh chọn nhanh số câu (1, 2, 3, ...) -->
      <div id="quiz-nav-chips" class="quiz-nav-chips">
        <!-- Rendered by JavaScript -->
      </div>

      <!-- Hộp câu hỏi hiện tại -->
      <div id="quiz-question-box" class="quiz-card">
        <!-- Rendered by JavaScript -->
      </div>

      <!-- Nút điều hướng Câu trước / Câu sau -->
      <div class="quiz-controls-bottom">
        <button id="btn-prev" class="btn btn-outline" onclick="prevQuestion()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Câu trước
        </button>
        <span id="quiz-progress-text"></span>
        <button id="btn-next" class="btn btn-primary" onclick="nextQuestion()">
          Câu sau
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
